name: Build & Release Korean Buddy APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Debug Keystore and Env
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env
          echo "# Empty env file for build" > .env

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/KoreanBuddy-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoreanBuddy-debug-apk
          path: release-artifacts/KoreanBuddy-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: "Korean Buddy: Learn Korean ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '(Latest Build)' }}"
          body: |
            ### 🇰🇷 Korean Buddy: Learn Korean Android App
            
            **Direct APK Download Link:**
            Click below to download and install the APK on your Android device:
            - 📲 **[Download KoreanBuddy-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/KoreanBuddy-debug.apk)**

            #### Features in this build:
            - **Hangul Alphabet Studio**: 14 Consonants, 5 Double Consonants, 10 Vowels, 11 Compound Vowels & Batchim rules.
            - **Interactive Syllable Builder**: Real-time syllable combination with audio & romanization.
            - **Trilingual Explanations**: English, Filipino (Tagalog), and Korean Immersion.
            - **4-Level Structured Course**: Absolute Beginner to Intermediate.
            - **Practice Hub**: Daily Challenge, Spaced Repetition Flashcards, Conversations & Quizzes.
            - **Offline Local Room Database**: Progress, study streaks, and saved favorites.
          files: release-artifacts/KoreanBuddy-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
